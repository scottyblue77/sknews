name: News sammeln

on:
  schedule:
    - cron: "17 * * * *"   # stündlich
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["config/interests.json", "collector/**", "docs/*.html", "docs/*.js", ".github/workflows/collect.yml"]

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sammler ausführen
        env:
          # Optional: wertet neue YouTube-Videos mit Gemini aus (Kanäle mit "analyse": "gemini")
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python collector/collect.py
      - name: Daten committen
        run: |
          git config user.name "sknews-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -m "Daten aktualisiert $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
      # Veröffentlichen auf Cloudflare Pages (eigene Domain). Läuft nur, wenn die
      # Secrets CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID gesetzt sind.
      - name: Auf Cloudflare Pages veröffentlichen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare-Secrets fehlen, überspringe"; exit 0
          fi
          npx --yes wrangler@4 pages project create sknews --production-branch=main 2>/dev/null || true
          npx --yes wrangler@4 pages deploy docs --project-name=sknews --branch=main --commit-dirty=true
