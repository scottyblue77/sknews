name: Deals-Preise suchen

# Kostenlose Preissuche ohne Preis-API: Suche nach EAN/Modell, Händlerseiten lesen, optional KI (Gemini).
# Auf main alle 3 Stunden mit Commit der Daten; auf anderen Zweigen nur Probelauf ohne Commit.
on:
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:
  push:
    paths: ["deals/finder.py", "deals/deals.py", "config/deals.json", ".github/workflows/deals.yml"]

permissions:
  contents: write

concurrency:
  group: deals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: cd deals && python -m unittest discover -s tests
      - name: Preise suchen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd deals
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then python finder.py; else python finder.py --dry-run; fi
      - name: Daten committen
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "sknews-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/deals.json docs/data/deals-history.json
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -m "Deals-Preise aktualisiert $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
