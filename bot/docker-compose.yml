# SKNews-Telegram-Bot für ZimaOS (oder jeden Rechner mit Docker).
# ZimaOS: App Store → "+" → "Eigene App installieren" → Import → diese Datei einfügen,
# dann die drei Werte unten eintragen. Der Container lädt den Bot-Code beim Start aus dem Repo,
# ein Neustart holt also automatisch die neueste Version.
name: sknews-bot
services:
  sknews-bot:
    image: python:3.12-slim
    container_name: sknews-bot
    restart: unless-stopped
    environment:
      TELEGRAM_TOKEN: ""        # von @BotFather
      ANTHROPIC_API_KEY: ""     # von console.anthropic.com (mit OLLAMA_URL optional, dann nur Fallback)
      OLLAMA_URL: ""            # lokales Modell, z. B. http://192.168.1.50:11434, leer = nur Claude
      OLLAMA_MODEL: qwen3.8:27b
      ALLOWED_CHAT_IDS: ""      # deine Telegram-Chat-ID (der Bot verrät sie dir beim ersten /start)
      GITHUB_TOKEN: ""          # optional: damit Bewertungen aus Telegram auch im Dashboard landen
      BRIEFING_TIME: "07:30"    # tägliches Briefing, leer lassen zum Abschalten
      TZ: Europe/Berlin
      CLAUDE_MODEL: claude-opus-5-5
      CLAUDE_EFFORT: low
      BOT_SOURCE: https://raw.githubusercontent.com/scottyblue77/sknews/main/bot
      # Haus und Heimnetz (alles optional, leer = aus), siehe README
      HA_URL: ""                # z. B. http://192.168.1.17:8123
      HA_TOKEN: ""              # Langzeit-Token des eigenen HA-Benutzers "KI-Agent" (kein Admin)
      LOKI_URL: ""              # z. B. http://192.168.1.17:3100
      HEIM_HOSTS: "Home Assistant=192.168.1.17:8123,n8n=192.168.1.17:5678,Loki=192.168.1.17:3100,CCU3=192.168.1.201:80,Synology=192.168.1.23:5000,UniFi=192.168.1.1:443,Ollama-PC=192.168.1.50:11434,OctoPrint=192.168.1.233:80"
      WATCH_MINUTES: "5"        # Ausfall-Meldungen, 0 = aus
      HEIM_CLAUDE: "false"      # true = Claude darf als Ersatz auch Hausdaten sehen
    volumes:
      - /DATA/AppData/sknews-bot:/data
    working_dir: /app
    command:
      - sh
      - -c
      - python -c 'import urllib.request as u, os; [u.urlretrieve(os.environ["BOT_SOURCE"] + "/" + f, f) for f in ("bot.py", "memory.py", "heim.py", "requirements.txt")]' && pip install --no-cache-dir -q --root-user-action=ignore -r requirements.txt && exec python -u bot.py
